<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="Kyrylo Kovalchuk">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="book">
  <meta property="og:site_name" content="Philosophy of Kerik">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  {{URL_META}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <title>{{TITLE}}</title>
  {{HREFLANG}}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=20260812-articles1">
  <link rel="stylesheet" href="/assets/books.css?v=20260812-books1">
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body>
<a class="skip-link" href="#book-reader">{{SKIP}}</a>
<header class="reader-header">
  <a class="brand" href="/" aria-label="Philosophy of Kerik — home">KERIK</a>
  <a class="reader-back" href="/#book">{{BACK_LABEL}}</a>
</header>
<main class="reader-main" id="book-reader">
  <header class="reader-hero">
    <p class="eyebrow">{{EDITION_LABEL}}</p>
    <h1>{{TITLE_HEADING}}</h1>
    <p class="reader-author">{{AUTHOR_LABEL}}</p>
    <p class="reader-note">{{READER_NOTE}}</p>
  </header>
  <article class="reader-document" aria-label="{{TITLE_HEADING}}">
    {{BOOK_PAGES}}
  </article>
</main>
<footer class="reader-footer">
  <span>© 2026 Kyrylo Kovalchuk. {{FOOTER_RIGHTS}}</span>
  <a href="/#book">{{BACK_LABEL}}</a>
</footer>
</body>
</html>
