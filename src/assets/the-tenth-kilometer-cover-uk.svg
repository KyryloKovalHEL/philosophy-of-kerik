<svg xmlns="http://www.w3.org/2000/svg" width="688" height="1060" viewBox="0 0 688 1060" role="img" aria-labelledby="title desc"><title id="title">Десятий кілометр — Кєрік</title><desc id="desc">Темна мінімалістична обкладинка книги</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17130d"/><stop offset=".55" stop-color="#0b0a08"/><stop offset="1" stop-color="#11100d"/></linearGradient></defs><rect width="688" height="1060" fill="url(#bg)"/><rect x="48" y="48" width="592" height="964" fill="none" stroke="#4a4030"/><text x="70" y="105" fill="#d8b06a" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="7">KERIK</text><text x="70" y="310" fill="#f0ede5" font-family="Georgia, serif" font-size="78">ДЕСЯТИЙ</text><text x="70" y="395" fill="#f0ede5" font-family="Georgia, serif" font-size="78">КІЛОМЕТР</text><line x1="70" y1="458" x2="618" y2="458" stroke="#d8b06a"/><text x="70" y="545" fill="#d8b06a" font-family="Georgia, serif" font-size="42">500 М</text><text x="315" y="545" fill="#817c74" font-family="Arial, sans-serif" font-size="32">→</text><text x="402" y="545" fill="#d8b06a" font-family="Georgia, serif" font-size="42">10 КМ</text><text x="70" y="685" fill="#c7c0b5" font-family="Arial, sans-serif" font-size="25">Подагра, інвалідність</text><text x="70" y="725" fill="#c7c0b5" font-family="Arial, sans-serif" font-size="25">і повернення до життя</text><text x="70" y="925" fill="#817c74" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">ДОКУМЕНТАЛЬНА ІСТОРІЯ</text><text x="70" y="970" fill="#f0ede5" font-family="Georgia, serif" font-size="30">Кєрік</text></svg>